
apiVersion: v1
kind: Secret
metadata:
  name: postgres-mcp-db-secret
  namespace: default
type: Opaque
stringData:
  # IMPORTANT: Replace this with your actual PostgreSQL connection string.
  # The format is: postgresql://<user>:<password>@<host>:<port>/<database>
  DATABASE_URI: "postgresql://app:password@pg-rw.default.svc.cluster.local:5432/app"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp-deployment
  namespace: default
  labels:
    app: postgres-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-mcp
  template:
    metadata:
      labels:
        app: postgres-mcp
    spec:
      containers:
      - name: postgres-mcp
        # It is recommended to pin this to a specific version in production
        image: crystaldba/postgres-mcp:latest
        command: ["postgres-mcp"]
        args: ["--transport=sse", "--access-mode=unrestricted"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: postgres-mcp-db-secret
              key: DATABASE_URI
        - name: LOG_LEVEL
          value: DEBUG
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-mcp-service
  namespace: default
spec:
  selector:
    app: postgres-mcp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
