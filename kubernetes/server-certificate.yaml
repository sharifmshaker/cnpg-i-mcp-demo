apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-plugin-server
spec:
  secretName: mcp-plugin-server-tls
  commonName: "mcp-plugin"
  dnsNames:
    - mcp-plugin

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
