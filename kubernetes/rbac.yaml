---
# ServiceAccount for the plugin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-mcp-plugin
  namespace: default
---
# ClusterRole to allow service management
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-mcp-plugin
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding to bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-mcp-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-mcp-plugin
subjects:
- kind: ServiceAccount
  name: postgres-mcp-plugin
  namespace: default
